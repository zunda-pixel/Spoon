name: CI

on:
  pull_request:
  # Pull request branches are covered by the pull_request event; running on
  # every push as well built each PR commit twice.
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request cancels its outdated run. main pushes are
# grouped per commit, so each one keeps its own run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  spoon-kit:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      - name: Build SpoonUI
        working-directory: SpoonKit
        run: swift build

      - name: Test SpoonCore
        working-directory: SpoonKit
        run: swift test --filter SpoonCoreTests
