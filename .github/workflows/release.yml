name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      - name: Build
        run: |
          DERIVED_DATA_PATH="$RUNNER_TEMP/DerivedData"
          echo "DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> "$GITHUB_ENV"

          xcodebuild \
            -project Spoon.xcodeproj \
            -scheme Spoon \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -skipPackagePluginValidation \
            MARKETING_VERSION="$TAG" \
            SPOON_RELEASE_TAG="$TAG" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            -skipMacroValidation \
            build

      - name: Verify version
        # The in-app updater compares release tags with SpoonReleaseTag.
        run: |
          plist="$DERIVED_DATA_PATH/Build/Products/Release/Spoon.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SpoonReleaseTag' "$plist")" = "$TAG"

      - name: Verify signature
        run: codesign --verify --deep --strict --verbose=2 "$DERIVED_DATA_PATH/Build/Products/Release/Spoon.app"

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$DERIVED_DATA_PATH/Build/Products/Release/Spoon.app" \
            "Spoon-${TAG}-macOS.zip"

      - name: Publish release
        run: gh release create "$TAG" --title "$TAG" --generate-notes "Spoon-${TAG}-macOS.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
